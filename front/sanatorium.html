<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Санаторий — Опа-Решим</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #F1EBE1; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #F1EBE1; }
    ::-webkit-scrollbar-thumb { background: #c9b894; border-radius: 4px; }
  </style>
</head>
<body class="text-[#3d2817] min-h-screen selection:bg-[#c8d9b0] selection:text-[#3d2817]">

  <header class="border-b border-[#e0d3b3] bg-[#F1EBE1]/95 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <img src="assets/sloth-icon.png" alt="Опа-Решим" class="w-10 h-10 object-contain">
        <div>
          <span class="text-xl font-black text-[#6b4226]">Опа-Решим</span>
          <span class="text-[11px] text-[#6b5a45] block -mt-1">Курорты и санатории России</span>
        </div>
      </a>
      <nav class="flex items-center gap-3">
        <a href="index.html" class="text-xs font-medium text-[#3d2817] hover:text-[#6b4226] transition px-3 py-1.5">Главная</a>
        <a href="search.html" class="text-xs font-medium text-[#3d2817] hover:text-[#6b4226] transition px-3 py-1.5">Подбор</a>
        <button id="loginBtn" onclick="openAuthModal('login')" class="hidden px-3 py-1.5 rounded-2xl bg-[#6b4226] hover:bg-[#553319] text-white text-xs font-bold transition">
          Войти
        </button>
        <a id="profileLink" href="profile.html" class="hidden items-center gap-2 px-3 py-1.5 rounded-2xl bg-white border border-[#e0d3b3] hover:border-[#8a9a5b] transition">
          <div id="headerAvatar" class="w-7 h-7 rounded-full bg-[#6b4226] flex items-center justify-center text-xs font-bold text-white"></div>
          <span id="headerName" class="text-xs font-medium text-[#3d2817]"></span>
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <a href="search.html" class="text-xs text-[#6b5a45] hover:text-[#6b4226] transition">← Назад к подбору</a>
    <div id="content" class="mt-6">
      <div class="text-center text-[#9a8b6f] text-sm py-10">Загрузка...</div>
    </div>
  </main>

  <footer class="border-t border-[#e0d3b3] mt-12 py-6 bg-[#F1EBE1]">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-[#6b5a45]">
      Опа-Решим
    </div>
  </footer>

  <script type="module" src="js/pages/sanatorium.js"></script>
</body>
</html>
