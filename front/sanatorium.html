<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Санаторий — Опа-Решим</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #f0e6d2;
      --bg-soft: #e8dcc4;
      --green-soft: #c8d9b0;
      --text: #3d2817;
      --text-mute: #6b5a45;
      --accent-1: #6b4226;
      --accent-2: #8a9a5b;
      --accent-3: #c97b5a;
    }
    body { background-color: var(--bg); color: var(--text); }
    .vibe-pulse { animation: pulse 2.5s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(107, 66, 38, 0.3); }
      50% { box-shadow: 0 0 0 12px rgba(107, 66, 38, 0); }
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #c9b894; border-radius: 4px; }

    .btn-primary { background-color: var(--accent-1); color: #fff; }
    .btn-primary:hover { background-color: #553319; }
    .btn-secondary { background-color: #fff; border: 1px solid #d5c8a8; color: var(--text); }
    .btn-secondary:hover { border-color: var(--accent-1); color: var(--accent-1); }

    .card { background: #fff; border: 1px solid #e3d8bd; }

    .tag-proc { background: var(--green-soft); color: #3d4a22; border: 1px solid #b0c296; }
    .tag-tour { background: #f4d9cb; color: #7a3f28; border: 1px solid #e2b8a3; }

    .text-accent-1 { color: var(--accent-1); }
    .text-accent-3 { color: var(--accent-3); }
  </style>
</head>
<body class="min-h-screen selection:bg-[#c8d9b0] selection:text-[#3d2817]">

  <header class="border-b border-[#e0d3b3] bg-[#f0e6d2]/95 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <video src="assets/sloth.mp4" autoplay loop muted playsinline class="w-11 h-11 object-contain vibe-pulse"></video>
        <div>
          <span class="text-xl font-black text-accent-1">Опа-Решим</span>
          <span class="text-[11px] text-[#6b5a45] block -mt-1">Интеллектуальный подбор отдыха</span>
        </div>
      </a>
      <nav class="flex items-center gap-3">
        <a href="index.html" class="text-xs font-medium text-[#3d2817] hover:text-accent-1 transition px-3 py-1.5">Главная</a>
        <a href="search.html" class="text-xs font-medium text-[#3d2817] hover:text-accent-1 transition px-3 py-1.5">Подбор</a>
        <a href="profile.html" class="flex items-center gap-2 px-3 py-1.5 rounded-2xl bg-white border border-[#e0d3b3] hover:border-accent-2 transition">
          <div id="headerAvatar" class="w-7 h-7 rounded-full bg-[#6b4226] flex items-center justify-center text-xs font-bold text-white">А</div>
          <span id="headerName" class="text-xs font-medium text-[#3d2817]">Профиль</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <a href="search.html" class="text-xs text-[#6b5a45] hover:text-accent-1 transition">← Назад к подбору</a>
    <div id="content" class="mt-6">
      <div class="text-center text-[#9a8b6f] text-sm py-10">Загрузка...</div>
    </div>
  </main>

  <footer class="border-t border-[#e0d3b3] mt-12 py-6 bg-[#e8dcc4]">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-[#6b5a45]">
      Опа-Решим · 2025
    </div>
  </footer>

  <script type="module" src="js/pages/sanatorium.js"></script>
</body>
</html>
